name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: phonebook
          POSTGRES_PASSWORD: phonebook
          POSTGRES_DB: phonebook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U phonebook" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://phonebook:phonebook@localhost:5432/phonebook_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/api/contacts | grep -q '"total"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
